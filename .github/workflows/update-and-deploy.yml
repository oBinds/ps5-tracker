name: Auto-Update & Deploy PS5 Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run game updater script
        run: python ps5-tracker/scripts/update_games.py

      - name: Commit updated games.json if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ps5-tracker/public/games.json
          git diff --cached --quiet || git commit -m "Auto-update games.json"
          git push

      - name: Copy files for Cloudflare deploy
        run: |
          mkdir -p deploy
          cp ps5-tracker/public/games.json deploy/games.json
          cp ps5-tracker/public/index.html deploy/index.html
          echo "Files ready:"
          ls -la deploy/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=ps5-tracker --commit-dirty=true
