name: Auto-Update & Deploy PS5 Tracker

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy files for Cloudflare deploy
        run: |
          mkdir -p deploy
          find . -name "games.json" -not -path "./deploy/*" | head -1 | xargs -I{} cp {} deploy/games.json
          find . -name "index.html" -not -path "./deploy/*" | head -1 | xargs -I{} cp {} deploy/index.html
          echo "Files ready:"
          ls -la deploy/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=ps5-tracker --commit-dirty=true
