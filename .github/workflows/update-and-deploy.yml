name: Auto-Update & Deploy PS5 Tracker

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Find and run game data updater
        run: |
          SCRIPT=$(find . -name "update_games.py" | head -1)
          echo "Found script at: $SCRIPT"
          python "$SCRIPT"

      - name: Find games.json and check for changes
        id: check_changes
        run: |
          GAMES=$(find . -name "games.json" | head -1)
          echo "Found games.json at: $GAMES"
          echo "GAMES_PATH=$GAMES" >> $GITHUB_ENV
          git diff --quiet "$GAMES" || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated games.json
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "Binds PS5 Tracker Bot"
          git config --global user.email "tracker@binds.dev"
          git add "$GAMES_PATH"
          git commit -m "🎮 Auto-update: PS5 game data $(date -u '+%Y-%m-%d')"
          git push

      - name: Copy files for Cloudflare deploy
        run: |
          mkdir -p deploy
          find . -name "games.json" | head -1 | xargs -I{} cp {} deploy/games.json
          find . -name "index.html" | head -1 | xargs -I{} cp {} deploy/index.html
          ls -la deploy/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=ps5-tracker --commit-dirty=true
